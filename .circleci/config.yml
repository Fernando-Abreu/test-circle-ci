version: 2.1

jobs:
  job-a:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Fail Immediately
          command: |
            echo "Job A is failing"
            exit 1

  job-b:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Sleep and Succeed
          command: |
            echo "Job B started"
            sleep 10
            echo "Job B succeeded"

  job-c:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Dependent Job
          command: |
            echo "Job C depends on B and runs only if B succeeds"

workflows:
  version: 2
  sample-workflow:
    jobs:
      - job-a
      - job-b
      - job-c:
          requires:
            - job-b