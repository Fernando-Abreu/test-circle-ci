version: 2.1

workflows:
  version: 2
  example-workflow:
    jobs:
      - build_apps:
          name: build-apps-prod
          docker:
            - image: cimg/base:stable
          steps:
            - run:
                name: Build apps (prod)
                command: echo "Building prod apps"

      - build_apps:
          name: build-apps-demo-2
          docker:
            - image: cimg/base:stable
          steps:
            - run:
                name: Build apps (demo)
                command: echo "Building demo apps"

      - deploy:
          name: deploy-prod
          docker:
            - image: cimg/base:stable
          steps:
            - run:
                name: Deploy prod
                command: echo "Deploying prod apps"
          requires:
            - build-apps-prod  