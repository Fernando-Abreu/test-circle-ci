version: 2.1

jobs:
  test:
    type: no-op

  build:
    type: no-op

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Sleep for 1 minute
          command: sleep 180

workflows:
  main-workflow:
    jobs:
      - test
      - build
      - deploy:
          serial-group: << pipeline.git.branch >>
          requires:
            - test
            - build