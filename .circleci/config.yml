version: 2.1

jobs:
  job_a:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Succesfull step
          command: echo "nothing"

  job_b:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Run only if job_a fails
          command: echo "job_a failed, so I'm running"

workflows:
  version: 2.1
  main-workflow:
    jobs:
      - job_a
      - job_b:
          requires:
            - job_a: failed