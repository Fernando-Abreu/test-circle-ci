version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Build"
          command: "echo build"
  test:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Test"
          command: "echo test"
  deploy:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Deploy"
          command: exit 1
  
  release:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Release"
          command: "echo release" 

  cleanup:
    docker:
      - image: cimg/base:current

    steps:
      - checkout
      - run:
          name: "Cleanup"
          command: "echo cleanup"  

workflows:
  say-hello-workflow:
    jobs:
      - build
      - test:
          requires:
            - build: success
      - deploy:
          requires:
            - test:
              - success
      - release:
          requires:
            - deploy:
              - success            
      - cleanup:
          requires:
            - deploy:
              - failed
