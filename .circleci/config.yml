version: 2.1

jobs:
  test-job:
    docker:
      - image: cimg/node:20.0  # Replace with an image that suits your project
    steps:
      - checkout

      - restore_cache:
          name: Restore Node Modules Cache
          keys:
            - v1-node-modules-{{ checksum "package-lock.json" }}
            - v1-node-modules-

      - run:
          name: Install Dependencies
          command: npm install

      - run:
          name: Run Tests
          command: npm test -- --outputFile=test-results.json

      - store_test_results:
          path: test-results.json

      - save_cache:
          name: Save Node Modules Cache
          key: v1-node-modules-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

workflows:
  version: 2
  test-workflow:
    jobs:
      - test-job