version: 2.1

jobs:
  a:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "Job A successful"

  b:
    docker:
      - image: cimg/base:stable
    steps:
      - run: exit 1

  or_job:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Check Job Statuses
          command: |
            # Fetch workflow jobs statuses
            curl -s -H "Circle-Token: $CIRCLECI_API_TOKEN" \
            "https://circleci.com/api/v2/workflow/$CIRCLE_WORKFLOW_ID/job" > jobs.json

            # Check if Job A or Job B succeeded
            if jq -e '.items[] | select(.name=="job_a" and .status=="success")' jobs.json || \
               jq -e '.items[] | select(.name=="job_b" and .status=="success")' jobs.json; then
              echo "At least one job succeeded. Proceeding to deploy."
              # Trigger deployment (this could be a call to another job or service)
            else
              echo "Neither job succeeded. Halting deployment."
              exit 1
            fi

  deploy:
    docker:
      - image: cimg/base:stable
    steps:
      - run: echo "Deploying..."

workflows:
  deploy_flow:
    jobs:
      - a
      - b
      - or_job:
          requires:
            - a
            - b:
              - failed
              - success
      - deploy:
          requires:
            - or_job
